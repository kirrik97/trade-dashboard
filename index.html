<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дашборд</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0d0d0d; color: #f2f2f2; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  main { padding: 20px 16px 48px; max-width: 480px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 650; margin: 0 0 8px; }
  .status { color: #ffb020; font-size: 16px; }
  .status.err { color: #ff5a5a; }
  .total { font-size: 40px; font-weight: 700; letter-spacing: -0.03em; margin: 12px 0 4px; }
  .sub { color: #9a9a9a; font-size: 13px; }
  .card { background: #171717; border-radius: 14px; padding: 14px 16px; margin-top: 12px; }
  .row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .name { font-weight: 650; }
  .up { color: #3dd68c; }
  .dn { color: #ff5a5a; }
  .muted { color: #9a9a9a; font-size: 13px; margin-top: 4px; }
  button { margin-top: 18px; background: #242424; color: #f2f2f2; border: 0; border-radius: 12px; padding: 12px 16px; font: inherit; }
</style>
</head>
<body>
<main>
  <h1>Дашборд</h1>
  <p id="status" class="status">Обновляем информацию</p>
  <div id="view" hidden></div>
  <button id="reload" type="button">Обновить</button>
</main>
<script>
const REPO = "kirrik97/trade-dashboard";
const statusEl = document.getElementById("status");
const view = document.getElementById("view");
let shownAt = "";

function money(n) {
  const v = Number(n);
  if (!Number.isFinite(v)) return "—";
  const sign = v > 0 ? "+" : "";
  return sign + v.toFixed(4) + " USDT";
}
function tone(n) { return Number(n) < 0 ? "dn" : "up"; }
function sideRu(side) { return side === "short" ? "шорт" : "лонг"; }

function setStatus(text, isErr) {
  statusEl.hidden = false;
  statusEl.className = isErr ? "status err" : "status";
  statusEl.textContent = text;
}

function render(data) {
  const positions = Array.isArray(data.positions) ? data.positions : [];
  const open = positions.filter((p) => Number(p.size) !== 0);
  const cards = open.map((p) => `
    <article class="card">
      <div class="row">
        <div class="name">${p.inst}</div>
        <div class="${tone(p.upl)}">${money(p.upl)}</div>
      </div>
      <div class="muted">${sideRu(p.side)} · размер ${p.size} · вход ${p.entry}${p.lev ? " · " + p.lev + "x" : ""}</div>
    </article>`).join("");
  shownAt = data.as_of || "";
  view.innerHTML = `
    <div class="total ${tone(data.upl_total)}">${money(data.upl_total)}</div>
    <div class="sub">Срез ${shownAt || "—"}</div>
    ${cards || '<p class="muted">Открытых сделок нет</p>'}
  `;
  view.hidden = false;
  statusEl.hidden = true;
}

async function fetchData() {
  const bust = "t=" + Date.now();
  const urls = [
    "./data.json?" + bust,
    "https://kirrik97.github.io/trade-dashboard/data.json?" + bust,
    "https://raw.githubusercontent.com/" + REPO + "/main/data.json?" + bust
  ];
  let lastErr;
  for (const url of urls) {
    try {
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) {
        lastErr = new Error("http " + res.status);
        continue;
      }
      return await res.json();
    } catch (err) {
      lastErr = err;
    }
  }
  throw lastErr || new Error("data");
}

async function load(attempt) {
  view.hidden = true;
  setStatus("Обновляем информацию", false);
  try {
    render(await fetchData());
  } catch (err) {
    if (attempt < 8) setTimeout(() => load(attempt + 1), 800);
    else setStatus("Не удалось загрузить. Нажми Обновить.", true);
  }
}

function pollForFresh(before, left) {
  const tick = async () => {
    try {
      const data = await fetchData();
      if (data.as_of && data.as_of !== before) {
        render(data);
        return;
      }
      if (left <= 1) {
        render(data);
        setStatus("Срез тот же. Жми «Дашборд» в чате, если нужны свежие цифры с биржи.", false);
        statusEl.hidden = false;
        return;
      }
    } catch (e) {}
    left -= 1;
    if (left > 0) setTimeout(tick, 1500);
    else load(0);
  };
  tick();
}

function askBot() {
  const before = shownAt;
  view.hidden = true;
  setStatus("Обновляем информацию", false);

  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    try { tg.ready(); tg.expand(); } catch (e) {}
    // sendData доходит только из KeyboardButton web_app, не из Menu Button.
    // Даже если вызов «успешен», без доставки бот не пушит — всегда поллим.
    try {
      if (typeof tg.sendData === "function") tg.sendData("refresh");
    } catch (e) {}
  }

  pollForFresh(before, 24);
}

(function boot() {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    try { tg.ready(); tg.expand(); } catch (e) {}
  }
  document.getElementById("reload").addEventListener("click", askBot);
  load(0);
})();
</script>
</body>
</html>
