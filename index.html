<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дашборд</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0b0c;
    --card: #161618;
    --text: #f3f3f3;
    --muted: #9b9ba0;
    --up: #3dd68c;
    --dn: #ff5a5a;
    --warn: #ffb020;
    --btn: #2a2a2e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  }
  main {
    padding: 20px 16px calc(28px + env(safe-area-inset-bottom));
    max-width: 480px;
    margin: 0 auto;
  }
  h1 { font-size: 22px; font-weight: 650; margin: 0 0 4px; letter-spacing: -0.02em; }
  .status { color: var(--warn); font-size: 14px; margin: 0 0 8px; min-height: 1.2em; }
  .status.err { color: var(--dn); }
  .status.ok { color: var(--muted); }
  .total { font-size: 42px; font-weight: 700; letter-spacing: -0.04em; margin: 8px 0 2px; }
  .sub { color: var(--muted); font-size: 13px; }
  .card { background: var(--card); border-radius: 14px; padding: 14px 16px; margin-top: 10px; }
  .row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .name { font-weight: 650; }
  .up { color: var(--up); }
  .dn { color: var(--dn); }
  .muted { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .actions { display: flex; gap: 10px; margin-top: 18px; }
  button {
    flex: 1;
    background: var(--btn);
    color: var(--text);
    border: 0;
    border-radius: 12px;
    padding: 13px 16px;
    font: inherit;
    font-weight: 600;
  }
  button:disabled { opacity: 0.55; }
  .live-dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 6px;
    vertical-align: middle;
    box-shadow: 0 0 0 0 rgba(61, 214, 140, 0.6);
    animation: pulse 2s infinite;
  }
  .live-dot.off { background: var(--muted); animation: none; box-shadow: none; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(61, 214, 140, 0.55); }
    70% { box-shadow: 0 0 0 8px rgba(61, 214, 140, 0); }
    100% { box-shadow: 0 0 0 0 rgba(61, 214, 140, 0); }
  }
</style>
</head>
<body>
<main>
  <h1>Дашборд</h1>
  <p id="status" class="status">Загрузка…</p>
  <div id="view" hidden></div>
  <div class="actions">
    <button id="reload" type="button">Обновить</button>
  </div>
</main>
<script>
const REPO = "kirrik97/trade-dashboard";
const MARK_MS = 3000;
const STRUCT_MS = 45000;
const statusEl = document.getElementById("status");
const view = document.getElementById("view");
const reloadBtn = document.getElementById("reload");
const tg = window.Telegram && window.Telegram.WebApp;

/** @type {{as_of:string, positions:any[]} | null} */
let structure = null;
/** @type {Record<string, number>} */
let ctVal = {};
/** @type {Record<string, number>} */
let marks = {};
let lastMarkAt = 0;
let busy = false;
let markTimer = 0;
let structTimer = 0;

function money(n) {
  const v = Number(n);
  if (!Number.isFinite(v)) return "—";
  return (v > 0 ? "+" : "") + v.toFixed(4) + " USDT";
}
function tone(n) { return Number(n) < 0 ? "dn" : "up"; }
function sideRu(side) { return side === "short" ? "шорт" : "лонг"; }
function setStatus(text, kind) {
  statusEl.hidden = false;
  statusEl.className = "status" + (kind === "err" ? " err" : kind === "ok" ? " ok" : "");
  statusEl.textContent = text;
}

function uplFor(p, mark) {
  const size = Number(p.size);
  const entry = Number(p.entry);
  const mult = Number(ctVal[p.inst] || p.ctVal || 0);
  if (!Number.isFinite(size) || !Number.isFinite(entry) || !Number.isFinite(mark) || !mult) {
    return Number(p.upl);
  }
  const diff = p.side === "short" ? (entry - mark) : (mark - entry);
  return size * mult * diff;
}

function computeBook() {
  const positions = (structure && structure.positions) || [];
  const open = positions.filter((p) => Number(p.size) !== 0);
  let upl_total = 0;
  const rows = open.map((p) => {
    const mark = marks[p.inst];
    const upl = Number.isFinite(mark) ? uplFor(p, mark) : Number(p.upl);
    upl_total += Number.isFinite(upl) ? upl : 0;
    return { ...p, mark, upl };
  });
  return { rows, upl_total };
}

function render() {
  if (!structure) return;
  const { rows, upl_total } = computeBook();
  const live = lastMarkAt && Date.now() - lastMarkAt < MARK_MS * 3;
  const cards = rows.map((p) => `
    <article class="card">
      <div class="row">
        <div class="name">${p.inst}</div>
        <div class="${tone(p.upl)}">${money(p.upl)}</div>
      </div>
      <div class="muted">${sideRu(p.side)} · размер ${p.size} · вход ${p.entry}${p.lev ? " · " + p.lev + "x" : ""}${Number.isFinite(p.mark) ? " · mark " + Number(p.mark) : ""}</div>
    </article>`).join("");
  view.innerHTML = `
    <div class="total ${tone(upl_total)}">${money(upl_total)}</div>
    <div class="sub"><span class="live-dot${live ? "" : " off"}"></span>${live ? "Live mark" : "Снимок"} · структура ${structure.as_of || "—"}</div>
    ${cards || '<p class="muted">Открытых сделок нет</p>'}
  `;
  view.hidden = false;
  if (live) setStatus("Котировки OKX обновляются", "ok");
}

async function fetchStructure() {
  const bust = "t=" + Date.now();
  const urls = [
    "https://raw.githubusercontent.com/" + REPO + "/main/data.json?" + bust,
    "https://cdn.jsdelivr.net/gh/" + REPO + "@main/data.json?" + bust,
    "./data.json?" + bust
  ];
  let lastErr;
  for (const url of urls) {
    try {
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error("http " + res.status);
      const data = await res.json();
      if (!Array.isArray(data.positions)) throw new Error("bad json");
      return data;
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error("structure");
}

async function ensureCtVal(instIds) {
  const missing = instIds.filter((id) => !ctVal[id]);
  await Promise.all(missing.map(async (instId) => {
    try {
      const res = await fetch(
        "https://www.okx.com/api/v5/public/instruments?instType=SWAP&instId=" + encodeURIComponent(instId),
        { cache: "force-cache" }
      );
      const body = await res.json();
      const row = body && body.data && body.data[0];
      if (row && row.ctVal) ctVal[instId] = Number(row.ctVal);
    } catch (e) {}
  }));
  // fallbacks if instruments blocked
  const fb = {
    "BTC-USDT-SWAP": 0.01,
    "ETH-USDT-SWAP": 0.1,
    "SOL-USDT-SWAP": 1,
    "BNB-USDT-SWAP": 0.01,
    "XRP-USDT-SWAP": 10,
    "TRX-USDT-SWAP": 100
  };
  for (const id of instIds) {
    if (!ctVal[id] && fb[id]) ctVal[id] = fb[id];
  }
}

async function fetchMarks(instIds) {
  if (!instIds.length) return;
  await ensureCtVal(instIds);
  await Promise.all(instIds.map(async (instId) => {
    try {
      const res = await fetch(
        "https://www.okx.com/api/v5/market/ticker?instId=" + encodeURIComponent(instId),
        { cache: "no-store" }
      );
      const body = await res.json();
      const last = body && body.data && body.data[0] && body.data[0].last;
      const mark = Number(last);
      if (Number.isFinite(mark)) marks[instId] = mark;
    } catch (e) {}
  }));
  lastMarkAt = Date.now();
}

async function refreshStructure(manual) {
  if (busy) return;
  busy = true;
  if (manual) reloadBtn.disabled = true;
  try {
    if (manual) setStatus("Обновляем структуру…", null);
    structure = await fetchStructure();
    const ids = (structure.positions || []).filter((p) => Number(p.size) !== 0).map((p) => p.inst);
    await fetchMarks(ids);
    render();
  } catch (e) {
    if (!structure) setStatus("Не удалось загрузить позиции. Нажми Обновить.", "err");
    else setStatus("Структура устарела, mark живой", "ok");
  } finally {
    busy = false;
    reloadBtn.disabled = false;
  }
}

async function refreshMarksOnly() {
  if (!structure) return;
  const ids = (structure.positions || []).filter((p) => Number(p.size) !== 0).map((p) => p.inst);
  try {
    await fetchMarks(ids);
    render();
  } catch (e) {}
}

function boot() {
  if (tg) {
    try {
      tg.ready();
      tg.expand();
      if (typeof tg.enableClosingConfirmation === "function") tg.enableClosingConfirmation(false);
      if (tg.setHeaderColor) tg.setHeaderColor("secondary_bg_color");
      if (tg.setBackgroundColor) tg.setBackgroundColor("#0b0b0c");
    } catch (e) {}
  }

  reloadBtn.addEventListener("click", () => refreshStructure(true));

  refreshStructure(false).then(() => {
    markTimer = setInterval(refreshMarksOnly, MARK_MS);
    structTimer = setInterval(() => refreshStructure(false), STRUCT_MS);
  });

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") refreshMarksOnly();
  });
}

boot();
</script>
</body>
</html>
