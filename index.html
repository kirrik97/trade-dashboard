<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дашборд</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { color-scheme: dark; --bg:#0b0b0c; --card:#161618; --text:#f3f3f3; --muted:#9b9ba0; --up:#3dd68c; --dn:#ff5a5a; --warn:#ffb020; --btn:#2a2a2e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
  main { padding: 20px 16px calc(28px + env(safe-area-inset-bottom)); max-width: 480px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 650; margin: 0 0 6px; letter-spacing: -0.02em; }
  .status { color: var(--warn); font-size: 15px; margin: 0 0 8px; }
  .status.err { color: var(--dn); }
  .total { font-size: 42px; font-weight: 700; letter-spacing: -0.04em; margin: 10px 0 2px; }
  .sub { color: var(--muted); font-size: 13px; }
  .card { background: var(--card); border-radius: 14px; padding: 14px 16px; margin-top: 10px; }
  .row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .name { font-weight: 650; }
  .up { color: var(--up); }
  .dn { color: var(--dn); }
  .muted { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .actions { display: flex; gap: 10px; margin-top: 18px; }
  button { flex: 1; background: var(--btn); color: var(--text); border: 0; border-radius: 12px; padding: 13px 16px; font: inherit; font-weight: 600; }
  button:disabled { opacity: 0.55; }
</style>
</head>
<body>
<main>
  <h1>Дашборд</h1>
  <p id="status" class="status">Обновляем информацию</p>
  <div id="view" hidden></div>
  <div class="actions">
    <button id="reload" type="button">Обновить</button>
  </div>
</main>
<script>
const REPO = "kirrik97/trade-dashboard";
const LIVE_API = (window.DASH_API || localStorage.getItem("DASH_API") || "").replace(/\/$/, "");
const statusEl = document.getElementById("status");
const view = document.getElementById("view");
const reloadBtn = document.getElementById("reload");
let shownAt = "";
let busy = false;

const tg = window.Telegram && window.Telegram.WebApp;

function money(n) {
  const v = Number(n);
  if (!Number.isFinite(v)) return "—";
  return (v > 0 ? "+" : "") + v.toFixed(4) + " USDT";
}
function tone(n) { return Number(n) < 0 ? "dn" : "up"; }
function sideRu(side) { return side === "short" ? "шорт" : "лонг"; }
function setStatus(text, isErr) {
  statusEl.hidden = false;
  statusEl.className = isErr ? "status err" : "status";
  statusEl.textContent = text;
}

function render(data) {
  const positions = Array.isArray(data.positions) ? data.positions : [];
  const open = positions.filter((p) => Number(p.size) !== 0);
  const cards = open.map((p) => `
    <article class="card">
      <div class="row">
        <div class="name">${p.inst}</div>
        <div class="${tone(p.upl)}">${money(p.upl)}</div>
      </div>
      <div class="muted">${sideRu(p.side)} · размер ${p.size} · вход ${p.entry}${p.lev ? " · " + p.lev + "x" : ""}</div>
    </article>`).join("");
  shownAt = data.as_of || "";
  view.innerHTML = `
    <div class="total ${tone(data.upl_total)}">${money(data.upl_total)}</div>
    <div class="sub">Срез ${shownAt || "—"}</div>
    ${cards || '<p class="muted">Открытых сделок нет</p>'}
  `;
  view.hidden = false;
  statusEl.hidden = true;
}

async function fetchLive() {
  if (!LIVE_API) return null;
  const initData = (tg && tg.initData) || "";
  if (!initData) throw new Error("need_telegram");
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 8000);
  try {
    const res = await fetch(LIVE_API + "/api/positions", {
      method: "GET",
      cache: "no-store",
      signal: ctrl.signal,
      headers: {
        "Accept": "application/json",
        "X-Telegram-Init-Data": initData
      }
    });
    if (res.status === 403) throw new Error("need_telegram");
    if (!res.ok) throw new Error("live_http_" + res.status);
    return await res.json();
  } finally {
    clearTimeout(t);
  }
}

async function fetchStatic() {
  const bust = "t=" + Date.now();
  // Prefer main raw (bot writes here). Pages/dash-refresh often stale.
  const urls = [
    "https://raw.githubusercontent.com/" + REPO + "/main/data.json?" + bust,
    "https://cdn.jsdelivr.net/gh/" + REPO + "@main/data.json?" + bust,
    "./data.json?" + bust
  ];
  let best = null;
  for (const url of urls) {
    try {
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) continue;
      const data = await res.json();
      if (!best || String(data.as_of || "") > String(best.as_of || "")) best = data;
      // main raw is authoritative enough — take first good from main/cdn
      if (url.includes("/main/") || url.includes("@main/")) return data;
    } catch (e) {}
  }
  if (best) return best;
  throw new Error("static_fail");
}

async function load(isManual) {
  if (busy) return;
  busy = true;
  reloadBtn.disabled = true;
  view.hidden = true;
  setStatus("Обновляем информацию", false);
  try {
    let data = null;
    let liveErr = null;
    try {
      data = await fetchLive();
    } catch (e) {
      liveErr = e;
    }
    if (!data) {
      if (liveErr && liveErr.message === "need_telegram" && isManual && LIVE_API) {
        setStatus("Открой дашборд из кнопки в Telegram", true);
        data = await fetchStatic().catch(() => null);
        if (data) render(data);
        return;
      }
      data = await fetchStatic();
    }
    render(data);
  } catch (err) {
    setStatus("Не удалось загрузить. Нажми Обновить.", true);
  } finally {
    busy = false;
    reloadBtn.disabled = false;
  }
}

function boot() {
  if (tg) {
    try {
      tg.ready();
      tg.expand();
      if (tg.setHeaderColor) tg.setHeaderColor("secondary_bg_color");
    } catch (e) {}
  }
  const params = new URLSearchParams(location.search);
  const api = params.get("api");
  if (api) {
    try { localStorage.setItem("DASH_API", api); } catch (e) {}
  }
  reloadBtn.addEventListener("click", () => load(true));
  load(false);
}
boot();
</script>
</body>
</html>
