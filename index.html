<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Дашборд</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0b0c;
    --card: #161618;
    --text: #f3f3f3;
    --muted: #9b9ba0;
    --up: #3dd68c;
    --dn: #ff5a5a;
    --warn: #ffb020;
    --btn: #2a2a2e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  }
  main {
    padding: 20px 16px calc(28px + env(safe-area-inset-bottom));
    max-width: 480px;
    margin: 0 auto;
  }
  h1 { font-size: 22px; font-weight: 650; margin: 0 0 4px; letter-spacing: -0.02em; }
  .clock {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    margin: 0 0 6px;
    font-variant-numeric: tabular-nums;
  }
  .status { color: var(--warn); font-size: 14px; margin: 0 0 8px; min-height: 1.2em; }
  .status.err { color: var(--dn); }
  .status.ok { color: var(--muted); }
  .total { font-size: 42px; font-weight: 700; letter-spacing: -0.04em; margin: 8px 0 2px; }
  .sub { color: var(--muted); font-size: 13px; line-height: 1.35; }
  .card { background: var(--card); border-radius: 14px; padding: 14px 16px; margin-top: 10px; }
  .row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .name { font-weight: 650; }
  .up { color: var(--up); }
  .dn { color: var(--dn); }
  .muted { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .prices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; margin-top: 10px; }
  .price-box { background: #1c1c1f; border-radius: 10px; padding: 8px 10px; }
  .price-label { color: var(--muted); font-size: 11px; margin-bottom: 2px; }
  .price-val { font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .actions { display: flex; gap: 10px; margin-top: 18px; }
  button {
    flex: 1;
    background: var(--btn);
    color: var(--text);
    border: 0;
    border-radius: 12px;
    padding: 13px 16px;
    font: inherit;
    font-weight: 600;
  }
  button:disabled { opacity: 0.55; }
  .live-dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--up);
    margin-right: 6px;
    vertical-align: middle;
    animation: pulse 2s infinite;
  }
  .live-dot.off { background: var(--muted); animation: none; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(61, 214, 140, 0.55); }
    70% { box-shadow: 0 0 0 8px rgba(61, 214, 140, 0); }
    100% { box-shadow: 0 0 0 0 rgba(61, 214, 140, 0); }
  }
</style>
</head>
<body>
<main>
  <h1>Дашборд</h1>
  <div id="clock" class="clock">—</div>
  <p id="status" class="status">Загрузка…</p>
  <div id="view" hidden></div>
  <div class="actions">
    <button id="reload" type="button">Обновить</button>
  </div>
</main>
<script>
const BUILD = "20261028-1115";
(function bustTelegramCache() {
  try {
    const u = new URL(location.href);
    if (u.searchParams.get("b") !== BUILD) {
      u.searchParams.set("b", BUILD);
      location.replace(u.toString());
      return;
    }
  } catch (e) {}
})();

const REPO = "kirrik97/trade-dashboard";
const MARK_MS = 3000;
const STRUCT_MS = 60000;
const statusEl = document.getElementById("status");
const view = document.getElementById("view");
const clockEl = document.getElementById("clock");
const reloadBtn = document.getElementById("reload");
const tg = window.Telegram && window.Telegram.WebApp;

let structure = null;
let ctVal = {};
let marks = {};
let lastMarkAt = 0;
let lastRefreshAt = 0;
let busy = false;

function money(n) {
  const v = Number(n);
  if (!Number.isFinite(v)) return "—";
  return (v > 0 ? "+" : "") + v.toFixed(4) + " USDT";
}
function px(n) {
  const v = Number(n);
  if (!Number.isFinite(v)) return "—";
  if (v >= 1000) return v.toLocaleString("ru-RU", { maximumFractionDigits: 2 });
  if (v >= 1) return v.toLocaleString("ru-RU", { maximumFractionDigits: 4 });
  return v.toLocaleString("ru-RU", { maximumFractionDigits: 6 });
}
function tone(n) { return Number(n) < 0 ? "dn" : "up"; }
function sideRu(side) { return side === "short" ? "шорт" : "лонг"; }
function coinName(inst) {
  return String(inst || "").replace(/-USDT-SWAP$/i, "").replace(/-SWAP$/i, "") || inst;
}

function mskParts(ts) {
  const d = new Date(ts || Date.now());
  const parts = new Intl.DateTimeFormat("ru-RU", {
    timeZone: "Europe/Moscow",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: false
  }).formatToParts(d);
  const get = (t) => (parts.find((p) => p.type === t) || {}).value || "00";
  return get("hour") + ":" + get("minute") + ":" + get("second");
}

function setStatus(text, kind) {
  statusEl.hidden = false;
  statusEl.className = "status" + (kind === "err" ? " err" : kind === "ok" ? " ok" : "");
  statusEl.textContent = text;
}

function haptic(ok) {
  try {
    if (tg && tg.HapticFeedback) {
      if (ok) tg.HapticFeedback.notificationOccurred("success");
      else tg.HapticFeedback.impactOccurred("light");
    }
  } catch (e) {}
}

function tickClock() {
  const now = mskParts(Date.now());
  const quote = lastMarkAt ? mskParts(lastMarkAt) : "—";
  const pressed = lastRefreshAt ? mskParts(lastRefreshAt) : null;
  clockEl.textContent = "Сейчас " + now + " МСК";
  if (structure && view && !view.hidden) {
    const sub = view.querySelector(".sub");
    if (sub) {
      const live = lastMarkAt && Date.now() - lastMarkAt < MARK_MS * 4;
      sub.innerHTML =
        '<span class="live-dot' + (live ? "" : " off") + '"></span>' +
        "Mark " + quote + " МСК" +
        (pressed ? " · кнопка " + pressed : "");
    }
  }
}

function uplFor(p, mark) {
  const size = Number(p.size);
  const entry = Number(p.entry);
  const mult = Number(ctVal[p.inst] || p.ctVal || 0);
  if (!Number.isFinite(size) || !Number.isFinite(entry) || !Number.isFinite(mark) || !mult) {
    return Number(p.upl);
  }
  const diff = p.side === "short" ? (entry - mark) : (mark - entry);
  return size * mult * diff;
}

function openIds() {
  return ((structure && structure.positions) || [])
    .filter((p) => Number(p.size) !== 0)
    .map((p) => p.inst);
}

function computeBook() {
  const positions = (structure && structure.positions) || [];
  const open = positions.filter((p) => Number(p.size) !== 0);
  let upl_total = 0;
  const rows = open.map((p) => {
    const mark = marks[p.inst];
    const upl = Number.isFinite(mark) ? uplFor(p, mark) : Number(p.upl);
    upl_total += Number.isFinite(upl) ? upl : 0;
    return { ...p, mark, upl };
  });
  return { rows, upl_total };
}

function render() {
  if (!structure) return;
  const { rows, upl_total } = computeBook();
  const cards = rows.map((p) => {
    const sl = p.sl != null && p.sl !== "" ? Number(p.sl) : NaN;
    const tp = p.tp != null && p.tp !== "" ? Number(p.tp) : NaN;
    return `
    <article class="card">
      <div class="row">
        <div class="name">${coinName(p.inst)}</div>
        <div class="${tone(p.upl)}">${money(p.upl)}</div>
      </div>
      <div class="muted">${sideRu(p.side)} · размер ${p.size}${p.lev ? " · " + p.lev + "x" : ""} · ${p.inst}</div>
      <div class="prices">
        <div class="price-box">
          <div class="price-label">Точка входа</div>
          <div class="price-val">${px(p.entry)}</div>
        </div>
        <div class="price-box">
          <div class="price-label">Mark сейчас</div>
          <div class="price-val">${Number.isFinite(p.mark) ? px(p.mark) : "—"}</div>
        </div>
        <div class="price-box">
          <div class="price-label">Stop loss</div>
          <div class="price-val ${Number.isFinite(sl) ? "dn" : ""}">${Number.isFinite(sl) ? px(sl) : "—"}</div>
        </div>
        <div class="price-box">
          <div class="price-label">Take profit</div>
          <div class="price-val ${Number.isFinite(tp) ? "up" : ""}">${Number.isFinite(tp) ? px(tp) : "—"}</div>
        </div>
      </div>
    </article>`;
  }).join("");
  view.innerHTML = `
    <div class="total ${tone(upl_total)}">${money(upl_total)}</div>
    <div class="sub"></div>
    ${cards || '<p class="muted">Открытых сделок нет</p>'}
  `;
  view.hidden = false;
  tickClock();
}

async function fetchStructure() {
  const bust = "t=" + Date.now() + "&b=" + BUILD;
  const urls = [];
  // Pin by commit sha — raw @main / jsDelivr @main часто отдают Fastly-кэш 5–10 мин.
  try {
    const meta = await fetch(
      "https://api.github.com/repos/" + REPO + "/commits/main?" + bust,
      { cache: "no-store", headers: { Accept: "application/vnd.github+json" } }
    );
    if (meta.ok) {
      const c = await meta.json();
      if (c && c.sha) {
        urls.push("https://raw.githubusercontent.com/" + REPO + "/" + c.sha + "/data.json?" + bust);
      }
    }
  } catch (e) {}
  urls.push(
    "https://raw.githubusercontent.com/" + REPO + "/main/data.json?" + bust,
    "./data.json?" + bust
  );
  let lastErr;
  for (const url of urls) {
    try {
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error("http " + res.status);
      const data = await res.json();
      if (!Array.isArray(data.positions)) throw new Error("bad json");
      return data;
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error("structure");
}

async function ensureCtVal(instIds) {
  const missing = instIds.filter((id) => !ctVal[id]);
  await Promise.all(missing.map(async (instId) => {
    try {
      const res = await fetch(
        "https://www.okx.com/api/v5/public/instruments?instType=SWAP&instId=" + encodeURIComponent(instId),
        { cache: "force-cache" }
      );
      const body = await res.json();
      const row = body && body.data && body.data[0];
      if (row && row.ctVal) ctVal[instId] = Number(row.ctVal);
    } catch (e) {}
  }));
  const fb = {
    "BTC-USDT-SWAP": 0.01,
    "ETH-USDT-SWAP": 0.1,
    "SOL-USDT-SWAP": 1,
    "BNB-USDT-SWAP": 0.01,
    "XRP-USDT-SWAP": 10,
    "TRX-USDT-SWAP": 100,
    "OKB-USDT-SWAP": 0.01
  };
  for (const id of instIds) {
    if (!ctVal[id] && fb[id]) ctVal[id] = fb[id];
  }
}

async function fetchMarks(instIds) {
  const ids = instIds && instIds.length ? instIds : [];
  if (!ids.length) {
    lastMarkAt = Date.now();
    return 0;
  }
  await ensureCtVal(ids);
  let ok = 0;
  await Promise.all(ids.map(async (instId) => {
    try {
      const res = await fetch(
        "https://www.okx.com/api/v5/market/ticker?instId=" + encodeURIComponent(instId) + "&_=" + Date.now(),
        { cache: "no-store" }
      );
      const body = await res.json();
      const last = body && body.data && body.data[0] && body.data[0].last;
      const mark = Number(last);
      if (Number.isFinite(mark)) {
        marks[instId] = mark;
        ok += 1;
      }
    } catch (e) {}
  }));
  // Часы кнопки двигаем всегда — даже если биржа вернула тот же mark.
  lastMarkAt = Date.now();
  return ok;
}

async function onRefreshClick() {
  if (busy) return;
  busy = true;
  reloadBtn.disabled = true;
  reloadBtn.textContent = "Обновляю…";
  setStatus("Снимаем OKX…", null);
  haptic(false);
  lastRefreshAt = Date.now();
  tickClock();

  try {
    // Всегда ждём свежую структуру — иначе «Обновить» крутит только mark по старому openIds
    // и ETH/новые позиции не появляются до следующего STRUCT_MS.
    structure = await fetchStructure();
    const n = await fetchMarks(openIds());
    render();
    lastRefreshAt = Date.now();
    const asOf = structure.as_of ? (" · срез " + structure.as_of) : "";
    setStatus("Обновлено " + mskParts(lastRefreshAt) + " МСК" + asOf, "ok");
    haptic(n >= 0);
    reloadBtn.textContent = "Готово";
  } catch (e) {
    setStatus("Ошибка. Нажми ещё раз.", "err");
    reloadBtn.textContent = "Обновить";
  } finally {
    busy = false;
    reloadBtn.disabled = false;
    setTimeout(() => {
      if (reloadBtn.textContent === "Готово") reloadBtn.textContent = "Обновить";
    }, 900);
  }
}

async function bootLoad() {
  setStatus("Загрузка…", null);
  structure = await fetchStructure();
  await fetchMarks(openIds());
  lastRefreshAt = Date.now();
  render();
  setStatus("Обновлено " + mskParts(lastRefreshAt) + " МСК", "ok");
}

function boot() {
  if (tg) {
    try {
      tg.ready();
      tg.expand();
      if (tg.setHeaderColor) tg.setHeaderColor("secondary_bg_color");
      if (tg.setBackgroundColor) tg.setBackgroundColor("#0b0b0c");
    } catch (e) {}
  }

  reloadBtn.addEventListener("click", onRefreshClick);
  setInterval(tickClock, 250);
  tickClock();

  bootLoad()
    .then(() => {
      setInterval(async () => {
        if (busy || !structure) return;
        await fetchMarks(openIds());
        render();
        setStatus("Обновлено " + mskParts(lastMarkAt) + " МСК", "ok");
      }, MARK_MS);
      setInterval(() => {
        if (busy) return;
        fetchStructure().then((d) => { structure = d; render(); }).catch(() => {});
      }, STRUCT_MS);
    })
    .catch(() => setStatus("Не загрузилось. Нажми Обновить.", "err"));

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") onRefreshClick();
  });
}

boot();
</script>
</body>
</html>
